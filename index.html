<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оценка урожайности</title>
     <link rel="icon" href="https://avatars.mds.yandex.net/i?id=521a8988bcfe1ced278db9e908567fe38d1aab09-5583420-images-thumbs&n=13" type="image/png" sizes="96x96" >
    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <header>
        <h1> Калькулятор урожайности</h1>
        <p>Оцените ожидаемый объем урожая и выручку</p>
    </header>

    <main>
        <form id="cropForm">
            <div class="form-group">
                <label for="culture">Культура:</label>
                <select id="culture" required>
                    <option value="" disabled selected>Выберите культуру</option>
                    <option value="Пшеница">Пшеница</option>
                    <option value="Кукуруза">Кукуруза</option>
                    <option value="Картофель">Картофель</option>
                    <option value="Подсолнечник">Подсолнечник</option>
                    <option value="Соя">Соя</option>
                </select>
            </div>

            <div class="form-group">
                <label for="area">Площадь участка (га):</label>
                <input type="number" id="area" step="0.01" min="0.01" placeholder="Например: 10" required>
            </div>

            <div class="form-group">
                <label for="yieldPerHa">Средняя урожайность (кг/га):</label>
                <input type="number" id="yieldPerHa" step="1" min="1" placeholder="Например: 5000" required>
            </div>

            <div class="form-group">
                <label for="lossPercent">Процент потерь (%):</label>
                <input type="number" id="lossPercent" step="0.1" min="0" max="100" placeholder="Например: 15" required>
            </div>

            <div class="form-group">
                <label for="price">Цена реализации (руб/кг):</label>
                <input type="number" id="price" step="0.01" min="0" placeholder="Например: 15" required>
            </div>

            <button type="submit" class="btn-calculate">Рассчитать</button>
        </form>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div id="resultSection" class="result-section" style="display: none;">
            <h2>--- Оценка урожайности ---</h2>
            <div class="input-summary">
                <p><strong>Культура:</strong> <span id="resCulture"></span></p>
                <p><strong>Площадь:</strong> <span id="resArea"></span> га</p>
                <p><strong>Урожайность:</strong> <span id="resYield"></span> кг/га</p>
                <p><strong>Потери:</strong> <span id="resLossPercent"></span>%</p>
                <p><strong>Цена:</strong> <span id="resPrice"></span> руб/кг</p>
            </div>

            <hr>

            <table class="result-table">
                <thead>
                    <tr>
                        <th>Показатель</th>
                        <th>Значение</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Валовой урожай</td>
                        <td id="valGross"></td>
                    </tr>
                    <tr>
                        <td>Потери</td>
                        <td id="valLosses"></td>
                    </tr>
                    <tr>
                        <td>Итоговый урожай</td>
                        <td id="valNet"></td>
                    </tr>
                    <tr class="highlight-row">
                        <td>Примерная выручка</td>
                        <td id="valRevenue"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Подключаем скрипт -->
<script src="script.js"></script>
</body>
</html>
